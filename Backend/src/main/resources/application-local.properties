# Perfil para la base PostgreSQL del docker-compose local.
# Activarlo con: --spring.profiles.active=local
spring.datasource.url=${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/gestion_academica}
spring.datasource.username=${LOCAL_DB_USERNAME:gestion_academica}
spring.datasource.password=${LOCAL_DB_PASSWORD:gestion_academica_dev}
spring.jpa.hibernate.ddl-auto=validate

# Evita abrir Swagger automaticamente al iniciar pruebas locales.
universidad.abrir-swagger-al-iniciar=${ABRIR_SWAGGER_AL_INICIAR:false}
