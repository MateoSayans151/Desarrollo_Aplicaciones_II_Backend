spring.application.name=gestion-academica
server.port=${SERVER_PORT:8080}

# El driver lo deduce Spring Boot a partir de la URL. Sin fallback: DB_URL, DB_USERNAME
# y DB_PASSWORD deben venir siempre del .env (los carga spring-dotenv al arrancar).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Supabase limita la cantidad de conexiones concurrentes, asi que el pool va corto.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

universidad.dominio-email=${UNIVERSIDAD_DOMINIO_EMAIL:universidad.edu.ar}
universidad.admin.email=${UNIVERSIDAD_ADMIN_EMAIL:admin@universidad.edu.ar}
universidad.admin.password=${UNIVERSIDAD_ADMIN_PASSWORD:CambiarEstaClave123!}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

universidad.abrir-swagger-al-iniciar=${ABRIR_SWAGGER_AL_INICIAR:true}
