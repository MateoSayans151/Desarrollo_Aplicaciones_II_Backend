spring.application.name=gestion-academica
server.port=${SERVER_PORT:8080}

# El driver lo deduce Spring Boot a partir de la URL. Sin fallback: DB_URL, DB_USERNAME
# y DB_PASSWORD deben venir siempre del .env (los carga spring-dotenv al arrancar).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Supabase limita la cantidad de conexiones concurrentes, asi que el pool va corto.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Validación del JWT de CORE (valores confirmados por CORE el 10/11/2026). Se aplica a toda
# petición con Bearer; sin Bearer sigue valiendo la sesión local del frontend propio.
core.jwt.jwk-set-uri=${CORE_JWT_JWK_SET_URI:https://core-api-production-e458.up.railway.app/.well-known/jwks.json}
core.jwt.issuer=${CORE_JWT_ISSUER:https://core-api-production-e458.up.railway.app}
core.jwt.audience=${CORE_JWT_AUDIENCE:uadenet}
# Firma HMAC del gateway (X-Core-Signature). El secreto lo pasa CORE por privado; mientras
# esté vacío no se valida la firma. X-Core-Timestamp viene en milisegundos desde epoch.
core.gateway.signature-secret=${CORE_GATEWAY_SIGNATURE_SECRET:}
core.gateway.signature-tolerance=${CORE_GATEWAY_SIGNATURE_TOLERANCE:PT5M}
# Servicios que pueden leer /internal/v1/** (claim service, separados por coma). CORE confirmó
# que el token de Backoffice trae service=backoffice. Vacío = cualquier token de servicio.
core.internal.allowed-services=${CORE_INTERNAL_ALLOWED_SERVICES:backoffice}

# El X-Correlation-Id de cada petición aparece en los logs.
logging.pattern.level=%5p [%X{correlationId:-}]

# Token de servicio de academic-service para llamar a otros módulos. CORE_SERVICE_TOKEN
# (token fijo) tiene prioridad; si no está, se pide a CORE con clientId y clientSecret (JSON).
# Dura 15 minutos. El secreto va sólo en variables de entorno, nunca en Git.
core.service.token-url=${CORE_SERVICE_TOKEN_URL:https://core-api-production-e458.up.railway.app/internal/v1/service-auth/token}
core.service.client-id=${CORE_SERVICE_CLIENT_ID:academic-service}
core.service.client-secret=${CORE_SERVICE_CLIENT_SECRET:}
core.service.token=${CORE_SERVICE_TOKEN:}

# Publicación de academic.term-defined.v1 (y a futuro academic.exam-scheduled.v1) por HTTP en
# CORE. Los eventos pasan por la tabla eventos_publicados y se envían cada CORE_EVENTS_SEND_INTERVAL.
core.events.publish-enabled=${CORE_EVENTS_PUBLISH_ENABLED:false}
core.events.url=${CORE_EVENTS_URL:https://core-api-production-e458.up.railway.app/internal/v1/events}
core.events.send-interval=${CORE_EVENTS_SEND_INTERVAL:PT15S}
core.events.max-attempts=50

# Backoffice (G8) es dueño del catálogo de sedes y espacios. Con BACKOFFICE_ENABLED=true
# se sincroniza /internal/v1/sites y /internal/v1/locations?type=AULA al iniciar y cada
# BACKOFFICE_SYNC_INTERVAL, y se bloquea el alta local de sedes y aulas.
backoffice.enabled=${BACKOFFICE_ENABLED:false}
backoffice.base-url=${BACKOFFICE_BASE_URL:https://backend-integracion-41b2dbda.up.railway.app}
backoffice.sites-path=/internal/v1/sites
backoffice.locations-path=/internal/v1/locations
backoffice.page-size=100
backoffice.sync-interval=${BACKOFFICE_SYNC_INTERVAL:PT6H}
# Cambios puntuales por evento (backoffice.location.upserted.v1). Requiere RABBITMQ_URL.
backoffice.events.enabled=${BACKOFFICE_EVENTS_ENABLED:false}
backoffice.events.queue=${BACKOFFICE_EVENTS_QUEUE:academic.locations.v1}

# Eventos de Docencia (teacher.attendance.recorded.v1 y teacher.exam-result.published.v1)
# desde la cola academic.teacher-events.v1. Requiere RABBITMQ_URL.
docencia.events.enabled=${TEACHER_EVENTS_ENABLED:false}
docencia.events.queue=${TEACHER_EVENTS_QUEUE:academic.teacher-events.v1}

universidad.dominio-email=${UNIVERSIDAD_DOMINIO_EMAIL:universidad.edu.ar}
universidad.admin.email=${UNIVERSIDAD_ADMIN_EMAIL:admin@universidad.edu.ar}
universidad.admin.password=${UNIVERSIDAD_ADMIN_PASSWORD:CambiarEstaClave123!}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

universidad.abrir-swagger-al-iniciar=${ABRIR_SWAGGER_AL_INICIAR:true}

# Cola de resultados para Analitica (legado: declara exchange y cola propios). NO activarla
# contra el RabbitMQ de CORE: el usuario academic no puede declarar y CORE cierra el canal.
analytics.queue.enabled=${ANALYTICS_QUEUE_ENABLED:false}
analytics.queue.exchange=${ANALYTICS_QUEUE_EXCHANGE:academica.eventos}
analytics.queue.queue=${ANALYTICS_QUEUE_NAME:analitica.resultados}
analytics.queue.routing-key=${ANALYTICS_QUEUE_ROUTING_KEY:resultado.publicado}

# RabbitMQ de CORE: RABBITMQ_URL=amqp://academic:<contraseña>@<host>:<puerto>/uadenet (usuario,
# contraseña y vhost salen de la URL). Sólo lectura de academic.*: no se declara nada.
# Sin RABBITMQ_URL se usa un RabbitMQ local (RABBITMQ_HOST/PORT/USERNAME/PASSWORD).
spring.rabbitmq.addresses=${RABBITMQ_URL:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Si la cola todavía no existe, el listener reintenta en vez de detenerse.
spring.rabbitmq.listener.simple.missing-queues-fatal=false
